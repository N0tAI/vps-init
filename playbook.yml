---
- name: Harden SSH, create thayen user, and disable debian user
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    # ---------------------------------------------------------------------------
    # SECRETS: Provide these via Ansible Vault, extra-vars, or a vars file.
    # If a value is omitted/empty, the playbook will fall back securely:
    #   - thayen_ssh_public_key: unset/empty -> skip authorized_key deployment
    # ---------------------------------------------------------------------------

    # thayen_ssh_public_key: "ssh-ed25519 AAAAC3..."

    sshd_config_src: "sshd_config"

  tasks:
    # =========================================================================
    # 0. Validate sshd_config on target before making ANY changes
    # =========================================================================
    - name: Validate sshd_config on target before changes
      block:
        - name: Copy sshd_config to temporary location for validation
          ansible.builtin.copy:
            src: "{{ sshd_config_src }}"
            dest: /tmp/ssh_config.new
            owner: root
            group: root
            mode: "0644"

        - name: Validate temporary sshd_config
          ansible.builtin.command:
            cmd: /usr/sbin/sshd -t -f /tmp/ssh_config.new
          changed_when: false
      rescue:
        - name: Remove invalid temporary sshd_config
          ansible.builtin.file:
            path: /tmp/ssh_config.new
            state: absent

        - name: Fail playbook due to invalid sshd_config
          ansible.builtin.fail:
            msg: "sshd_config validation failed. Playbook aborted to prevent lockout."
      always:
        - name: Clean up temporary sshd_config
          ansible.builtin.file:
            path: /tmp/ssh_config.new
            state: absent

    # =========================================================================
    # 1. Override ssh.socket to listen ONLY on port 49152
    # =========================================================================
    - name: Ensure ssh.socket override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/ssh.socket.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop ssh.socket port override
      ansible.builtin.copy:
        dest: /etc/systemd/system/ssh.socket.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Socket]
          ListenStream=
          ListenStream=49152
      notify: Restart ssh.socket

    # =========================================================================
    # 2. Reload systemd daemon
    # =========================================================================
    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

    # =========================================================================
    # 3. Enable the socket
    # =========================================================================
    - name: Enable and start ssh.socket
      ansible.builtin.systemd_service:
        name: ssh.socket
        enabled: true
        state: started

    # =========================================================================
    # 4. Create user thayen
    # =========================================================================
    - name: Create user thayen
      ansible.builtin.user:
        name: thayen
        shell: /bin/bash
        home: /home/thayen
        groups: sudo
        append: true
        state: present
      no_log: true

    - name: Force password change on first login
      ansible.builtin.command:
        cmd: chage -d 0 thayen
      changed_when: true
      no_log: true

    - name: Ensure thayen .ssh directory exists
      ansible.builtin.file:
        path: /home/thayen/.ssh
        state: directory
        owner: thayen
        group: thayen
        mode: "0700"

    - name: Add public key for thayen
      ansible.posix.authorized_key:
        user: thayen
        key: "{{ thayen_ssh_public_key }}"
        state: present
        manage_dir: false
      when: thayen_ssh_public_key | default('') | length > 0
      no_log: true

    - name: Ensure authorized_keys has strict permissions
      ansible.builtin.file:
        path: /home/thayen/.ssh/authorized_keys
        state: file
        owner: thayen
        group: thayen
        mode: "0600"

    # =========================================================================
    # 5. Overwrite default sshd_config
    # =========================================================================
    - name: Deploy custom sshd_config
      ansible.builtin.copy:
        src: "{{ sshd_config_src }}"
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0644"
      notify: Restart ssh.service

    # =========================================================================
    # 6. Disable debian user login (do NOT remove password)
    #    Equivalent to: usermod -e 1 -L debian && usermod -s /usr/sbin/nologin debian
    # =========================================================================
    - name: Disable debian user (nologin, locked password, expired account)
      ansible.builtin.user:
        name: debian
        shell: /usr/sbin/nologin
        password_lock: true
        expires: 1

  handlers:
    - name: Restart ssh.socket
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: restarted

    - name: Restart ssh.service
      ansible.builtin.systemd_service:
        name: ssh.service
        state: restarted
