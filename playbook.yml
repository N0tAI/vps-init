---
- name: Harden SSH, create thayen user, and disable debian user
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    # ---------------------------------------------------------------------------
    # SECRETS: Provide these via Ansible Vault, extra-vars, or a vars file.
    # If a value is omitted/empty, the playbook will fall back securely:
    #   - thayen_password: unset/empty -> force password expiry on first login
    #   - thayen_ssh_public_key: unset/empty -> skip authorized_key deployment
    # ---------------------------------------------------------------------------

    # thayen_password: !vault |
    #   $ANSIBLE_VAULT;1.1;AES256
    #   ...

    # thayen_ssh_public_key: "ssh-ed25519 AAAAC3..."

    # ---------------------------------------------------------------------------
    # REQUIRED: Path to the sshd_config file you want to deploy.
    # This path is relative to the playbook directory or an absolute path.
    # ---------------------------------------------------------------------------
    sshd_config_src: "files/sshd_config"

  tasks:
    # =========================================================================
    # 1. Override ssh.socket to listen ONLY on port 49152
    # =========================================================================
    - name: Ensure ssh.socket override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/ssh.socket.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop ssh.socket port override
      ansible.builtin.copy:
        dest: /etc/systemd/system/ssh.socket.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Socket]
          ListenStream=
          ListenStream=49152
      notify: Restart ssh.socket

    # =========================================================================
    # 2. Reload systemd daemon
    # =========================================================================
    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

    # =========================================================================
    # 3. Enable the socket
    # =========================================================================
    - name: Enable and start ssh.socket
      ansible.builtin.systemd_service:
        name: ssh.socket
        enabled: true
        state: started

    # =========================================================================
    # 4. Create user thayen
    # =========================================================================
    - name: Create user thayen
      ansible.builtin.user:
        name: thayen
        shell: /bin/bash
        home: /home/thayen
        groups: sudo
        append: true
        password: "{{ thayen_password | default(omit) }}"
        state: present
      no_log: true

    - name: Force password change on first login (if no password supplied)
      ansible.builtin.command:
        cmd: chage -d 0 thayen
      when: thayen_password | default('') | length == 0
      changed_when: true
      no_log: true

    - name: Ensure thayen .ssh directory exists
      ansible.builtin.file:
        path: /home/thayen/.ssh
        state: directory
        owner: thayen
        group: thayen
        mode: "0700"

    - name: Add public key for thayen
      ansible.posix.authorized_key:
        user: thayen
        key: "{{ thayen_ssh_public_key }}"
        state: present
        manage_dir: false
      when: thayen_ssh_public_key | default('') | length > 0
      no_log: true

    - name: Ensure authorized_keys has strict permissions
      ansible.builtin.file:
        path: /home/thayen/.ssh/authorized_keys
        state: file
        owner: thayen
        group: thayen
        mode: "0600"

    # =========================================================================
    # 5. Overwrite default sshd_config
    # =========================================================================
    - name: Deploy custom sshd_config
      ansible.builtin.copy:
        src: "{{ sshd_config_src }}"
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh.service

    # =========================================================================
    # 6. Disable debian user login (do NOT remove password)
    #    Equivalent to: usermod -e 1 -L debian && usermod -s /usr/sbin/nologin debian
    # =========================================================================
    - name: Disable debian user (nologin, locked password, expired account)
      ansible.builtin.user:
        name: debian
        shell: /usr/sbin/nologin
        password_lock: true
        expires: 1

  handlers:
    - name: Restart ssh.socket
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: restarted

    - name: Restart ssh.service
      ansible.builtin.systemd_service:
        name: ssh.service
        state: restarted
